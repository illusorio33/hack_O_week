<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechForum - Registration Successful</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .success-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      padding: 60px 40px;
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
    }

    /* Updated non-glitchy checkmark */
    .checkmark {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #48bb78, #38a169);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop-in 0.45s ease-out;
    }

    .checkmark::before {
      content: "✓";
      font-size: 40px;
      color: #ffffff;
      font-weight: 600;
      transform: translateY(-2px);
    }

    @keyframes pop-in {
      0% {
        transform: scale(0.2);
        opacity: 0;
      }
      60% {
        transform: scale(1.05);
        opacity: 1;
      }
      100% {
        transform: scale(1);
      }
    }

    h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      font-weight: 500;
      color: #1a202c;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    p {
      color: #718096;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .highlight {
      color: #38a169;
      font-weight: 600;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .dashboard-btn,
    .login-btn {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: 'JetBrains Mono', monospace;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .dashboard-btn {
      background: linear-gradient(135deg, #4299e1, #3182ce);
      color: white;
    }

    .dashboard-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(66, 153, 225, 0.3);
    }

    .login-btn {
      background: transparent;
      color: #4299e1;
      border: 2px solid #e2e8f0;
    }

    .login-btn:hover {
      background: #4299e1;
      color: white;
      border-color: #4299e1;
    }

    @media (max-width: 480px) {
      .success-container {
        padding: 40px 24px;
      }
      .btn-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="success-container">
    <div class="checkmark"></div>
    <h1>Registration Successful!</h1>
    <p>Welcome to <span class="highlight">TechForum</span>.</p>
    <p>Your account has been created. You can now explore discussions, ask questions, and connect with the tech community.</p>
    <div class="btn-group">
      <!-- Change href to your real dashboard route -->
      <a href="#dashboard" class="dashboard-btn">Go to Dashboard</a>
      <!-- Change href to your real login/landing page -->
      <a href="registerationForm.html" class="login-btn">Back to Login</a>
    </div>
  </div>
</body>
</html>
